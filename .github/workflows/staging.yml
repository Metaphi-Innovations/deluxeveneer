name: Frontend Deploy - deluxeveneer

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    env:
      PATH: /root/.nvm/versions/node/v20.19.6/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      PM2_HOME: /root/.pm2

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify node, npm and pm2
        run: |
          node -v
          npm -v
          pm2 -v

      - name: Copy files to deployment directory
        run: |
          rsync -av --exclude='.git' \
                    --exclude='node_modules' \
                    --exclude='.env' \
                    ./ /var/www/deluxeveneer/

      - name: Install dependencies
        working-directory: /var/www/deluxeveneer
        run: npm i

      - name: Stop existing pm2 process
        working-directory: /var/www/deluxeveneer
        run: |
          pm2 delete deluxeveneer.metaphi.in || true
          sleep 2

      - name: Start development server with pm2
        working-directory: /var/www/deluxeveneer
        run: |
          pm2 start npm --name "deluxeveneer.metaphi.in" -- start
          sleep 5
          pm2 save
          pm2 list
          pm2 logs deluxeveneer.metaphi.in --lines 30 --nostream
